<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>หลังร้าน · Staff dashboard</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/shop.generated.css">
<link rel="stylesheet" href="css/booking.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">
<!-- The staff dashboard: today's table bookings and pre-orders, from the backend (/api/admin).
     It shows nothing without the staff key (the ADMIN_KEY setting on Netlify).
     All the logic is in js/admin.js. -->
<main class="admin__wrap">
  <header class="admin__head">
    <div>
      <p class="admin__eyebrow">หลังร้าน · Staff</p>
      <h1 class="admin__title" data-shop>Dashboard</h1>
    </div>
    <button type="button" class="btn btn--ghost" data-signout hidden>ออกจากระบบ · Sign out</button>
  </header>

  <section class="admin__login" data-login>
    <div class="field">
      <label class="field__label" for="admin-key">รหัสพนักงาน · Staff key</label>
      <input class="field__input" id="admin-key" type="password" autocomplete="current-password" data-key>
    </div>
    <button type="button" class="btn btn--primary" data-signin>เข้าสู่ระบบ · Sign in</button>
    <p class="book__error" data-login-error role="alert"></p>
  </section>

  <section data-board hidden>
    <div class="admin__bar">
      <button type="button" class="btn btn--ghost" data-prev aria-label="วันก่อนหน้า · Previous day">‹</button>
      <label class="visually-hidden" for="admin-date">วันที่ · Date</label>
      <input class="field__input admin__date" id="admin-date" type="date" data-date>
      <button type="button" class="btn btn--ghost" data-next aria-label="วันถัดไป · Next day">›</button>
      <button type="button" class="btn btn--ghost" data-today>วันนี้ · Today</button>
      <p class="admin__updated" data-updated role="status"></p>
    </div>

    <dl class="admin__tiles">
      <div><dt>จองโต๊ะ · Bookings</dt><dd data-sum="bookings">0</dd></div>
      <div><dt>จำนวนแขก · Guests</dt><dd data-sum="guests">0</dd></div>
      <div><dt>ออเดอร์ · Orders</dt><dd data-sum="orders">0</dd></div>
      <div><dt>ยอดออเดอร์ · Order total</dt><dd data-sum="revenue">0</dd></div>
    </dl>

    <div class="admin__cols">
      <section aria-labelledby="h-tables">
        <h2 class="admin__h" id="h-tables">จองโต๊ะ · Table bookings</h2>
        <ul class="admin__list" data-tables role="list"></ul>
      </section>
      <section aria-labelledby="h-orders">
        <h2 class="admin__h" id="h-orders">ออเดอร์รับที่ร้าน · Pickup orders</h2>
        <ul class="admin__list" data-orders role="list"></ul>
      </section>
    </div>
  </section>
</main>
<script src="js/admin.js" defer></script>
</body>
</html>
