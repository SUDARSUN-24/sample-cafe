# netlify.toml — server settings for Netlify. Lives inside /site because
# /site is the folder you drag onto Netlify (it must be at the root of that folder).
# After deploying, check the headers really arrived:  curl -I https://YOUR-SITE.netlify.app

# ---------------------------------------------------------------- security
[[headers]]
  for = "/*"
  [headers.values]
    # Content-Security-Policy: the browser only loads what is listed here.
    #  - scripts, styles, fonts, images: only from this site ('self'). No inline scripts or styles.
    #  - img data: — the tiny blurred photo placeholders are data: URIs.
    #  - frame-src — the map preview (OpenStreetMap, or Google if location.embed = "google").
    #    If you never use one of them, you can delete it from this line.
    #  - frame-ancestors 'none' — nobody may show this site inside their own frame (anti-clickjacking).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; manifest-src 'self'; frame-src https://www.openstreetmap.org https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000"

# ------------------------------------------------------------------ caching
# Photos and fonts never change under the same name (photo names contain a
# content hash, see tools/images.py), so browsers may keep them for a year.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# HTML, CSS, JS and config.js keep their names when you edit them, so they are
# NOT cached long: the browser re-checks them each visit (a fast "304 Not
# Modified" when nothing changed). That way a new deploy shows up immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
